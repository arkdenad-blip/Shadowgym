<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Gym | Master Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --dark-green: #0a1f14; --gold: #d4af37; --black: #050505; --text: #ffffff; }
        body { background-color: var(--black); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--dark-green); border: 2px solid var(--gold); border-radius: 15px; padding: 20px; box-sizing: border-box; }
        
        .header h1 { color: var(--gold); font-size: 2rem; margin: 0; text-align: center; letter-spacing: 2px; }
        .section-title { border-bottom: 1px solid var(--gold); padding-bottom: 5px; margin: 20px 0 10px 0; color: var(--gold); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        
        .form-group { margin: 12px 0; }
        label { display: block; font-size: 0.7rem; margin-bottom: 4px; color: var(--gold); }
        input, select { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 5px; color: white; box-sizing: border-box; }

        .btn { width: 100%; background: var(--gold); color: #000; padding: 14px; border: none; border-radius: 5px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        /* ADMIN SEARCH SECTION */
        .admin-panel { margin-top: 30px; background: #000; border: 1px solid var(--gold); border-radius: 10px; padding: 15px; }
        .search-input { background: #111; border: 1px solid var(--gold); padding: 12px; color: #fff; width: 100%; box-sizing: border-box; border-radius: 5px; }
        .history-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .record-card { background: #1a1a1a; padding: 10px; border-radius: 5px; margin-bottom: 8px; border-left: 4px solid var(--gold); font-size: 0.8rem; }
        
        /* VOUCHER STYLING */
        #voucher-card { display: none; margin-top: 20px; background: #fff; color: #000; padding: 15px; border-radius: 10px; border: 4px double #000; }
        .v-code { font-size: 1.4rem; font-weight: 900; text-align: center; background: #000; color: var(--gold); padding: 5px; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SHADOW GYM</h1>
        <p style="text-align:center; font-size: 0.6rem; color: var(--gold);">REGISTRY & VERIFICATION SYSTEM</p>
    </div>

    <div id="registration-section">
        <div class="section-title">Record New Payment</div>
        <form id="gymForm">
            <div class="form-group"><label>Member Name</label><input type="text" id="mName" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="mPhone" required></div>
            <div class="form-group"><label>Location</label><input type="text" id="mLoc"></div>
            <div class="form-group">
                <label>Member Type / Action</label>
                <select id="mType">
                    <option value="New Registration">New Registration (GH₵ 250)</option>
                    <option value="Old Member Dues">Old Member - Monthly Dues (GH₵ 200)</option>
                    <option value="Student Dues">Student - Monthly Dues (GH₵ 180)</option>
                    <option value="Walk-In">Walk-In (GH₵ 50)</option>
                </select>
            </div>
            <button type="button" class="btn" onclick="saveRecord()">Process & Save Record</button>
        </form>

        <div id="voucher-card">
            <h4 style="margin:0; text-align:center;">PAYMENT VOUCHER</h4>
            <div style="font-size: 0.7rem; margin-top:10px;">
                Member: <b id="v-name"></b><br>
                Type: <span id="v-type"></span><br>
                Date: <span id="v-date"></span>
            </div>
            <div class="v-code" id="v-code">-------</div>
            <button class="btn" style="font-size: 0.6rem; padding: 5px;" onclick="window.print()">Save to Device</button>
        </div>
    </div>

    <div class="admin-panel">
        <div class="section-title" style="margin-top:0;">Owner Search Portal</div>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or phone..." onkeyup="performSearch()">
        
        <div id="history-output" class="history-list">
            <p style="font-size: 0.7rem; color: #555; text-align:center;">Search results will appear here.</p>
        </div>
        
        <button onclick="exportData()" class="btn" style="background:#222; color:var(--gold); font-size:0.6rem;">Backup Data to Text</button>
    </div>

    <div style="margin-top:20px; font-size:0.6rem; color:#444; text-align:center;">
        Shadow Gym v3.0 | Local Secure Storage
    </div>
</div>

<script>
    // 1. SAVE FUNCTION
    function saveRecord() {
        const name = document.getElementById('mName').value.trim();
        const phone = document.getElementById('mPhone').value.trim();
        const loc = document.getElementById('mLoc').value || "N/A";
        const type = document.getElementById('mType').value;
        const date = new Date().toLocaleDateString('en-GB');

        if(!name || !phone) { alert("Name and Phone required!"); return; }

        // Generate ID
        const code = "SG-" + Math.floor(1000 + Math.random() * 9000);

        const newEntry = { name, phone, loc, type, date, code };

        // Save to LocalStorage
        let registry = JSON.parse(localStorage.getItem('shadow_registry')) || [];
        registry.push(newEntry);
        localStorage.setItem('shadow_registry', JSON.stringify(registry));

        // Show Voucher
        document.getElementById('v-name').innerText = name;
        document.getElementById('v-type').innerText = type;
        document.getElementById('v-date').innerText = date;
        document.getElementById('v-code').innerText = code;
        document.getElementById('voucher-card').style.display = "block";

        // Reset Form
        document.getElementById('gymForm').reset();
        performSearch(); // Refresh list
        alert("Record Saved Successfully!");
    }

    // 2. SEARCH & RETRIEVE FUNCTION
    function performSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const output = document.getElementById('history-output');
        const registry = JSON.parse(localStorage.getItem('shadow_registry')) || [];

        if(query === "") {
            output.innerHTML = "<p style='font-size: 0.7rem; color: #555; text-align:center;'>Total Records: " + registry.length + "</p>";
            return;
        }

        const filtered = registry.filter(m => 
            m.name.toLowerCase().includes(query) || 
            m.phone.includes(query)
        );

        output.innerHTML = "";

        if(filtered.length === 0) {
            output.innerHTML = "<p style='color:red; font-size:0.7rem;'>No record found.</p>";
        } else {
            // Sort by latest first
            filtered.reverse().forEach(m => {
                output.innerHTML += `
                    <div class="record-card">
                        <b>${m.name}</b> <span style="float:right; color:var(--gold)">${m.code}</span><br>
                        <small>${m.type} - ${m.date}</small><br>
                        <small>Loc: ${m.loc} | Tel: ${m.phone}</small>
                    </div>
                `;
            });
        }
    }

    // 3. BACKUP FUNCTION (In case you change phones)
    function exportData() {
        const data = localStorage.getItem('shadow_registry');
        if(!data) { alert("No records to export."); return; }
        const blob = new Blob([data], {type: "text/plain"});
        alert("Data ready. In a real app, this would download a backup file.");
    }
    
    // Initial Load
    window.onload = performSearch;
</script>

</body>
</html>
