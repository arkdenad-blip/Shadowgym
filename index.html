<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Gym - Cloud Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { 
            --gold: #d4af37; 
            --dark-overlay: rgba(0, 0, 0, 0.9); 
            --card-bg: rgba(25, 25, 25, 0.98); 
        }
        
        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            color: #f0f0f0; 
            background: #000;
            padding-bottom: 90px; 
        }

        .app-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1600') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.3);
        }

        .header { text-align: center; padding: 50px 20px 30px; }
        .header h1 { margin: 0; color: var(--gold); letter-spacing: 6px; font-size: 2.5rem; text-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid #222; z-index: 1000; }
        .nav-item { color: #555; text-decoration: none; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }

        .screen { display: none; padding: 0 15px; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card-bg); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        h3 { color: var(--gold); margin-top: 0; letter-spacing: 1px; text-transform: uppercase; font-size: 0.9rem; border-left: 4px solid var(--gold); padding-left: 12px; }

        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .gallery-grid img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid #444; cursor: zoom-in; }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        #lightbox img { max-width: 95%; max-height: 85%; border: 3px solid var(--gold); border-radius: 5px; }

        input, select { width: 100%; padding: 15px; margin: 8px 0; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: var(--gold); color: #000; border: none; font-weight: 900; border-radius: 10px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        
        .momo-box { background: #000; border: 2px dashed var(--gold); padding: 25px; text-align: center; border-radius: 15px; }
        .status-active { color: #2ecc71; font-weight: bold; }
        .status-pending { color: #f1c40f; font-weight: bold; }
        
        .member-list-item { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>
<div class="app-bg"></div>

<div class="header">
    <h1>SHADOW GYM</h1>
    <small style="color: #666; letter-spacing: 2px;">EST. 1999 • AKROPONG AKUAPEM</small>
</div>

<div id="home" class="screen active">
    <div class="card">
        <h3>Member Status</h3>
        <div id="userStatusArea"><p style="color: #666;">Syncing with cloud...</p></div>
    </div>
    <div class="card">
        <h3>Elite Gallery</h3>
        <div class="gallery-grid">
            <img src="https://images.unsplash.com/photo-1581009146145-b5ef03a7403f?q=80&w=400" onclick="viewImg(this.src)">
            <img src="https://images.unsplash.com/photo-1534367507873-d2d7e24c797f?q=80&w=400" onclick="viewImg(this.src)">
            <img src="https://images.unsplash.com/photo-1594381898411-846e7d193883?q=80&w=400" onclick="viewImg(this.src)">
            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=400" onclick="viewImg(this.src)">
            <img src="https://images.unsplash.com/photo-1574673001865-4527bc33c9ab?q=80&w=400" onclick="viewImg(this.src)">
            <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?q=80&w=400" onclick="viewImg(this.src)">
        </div>
    </div>
</div>

<div id="register" class="screen">
    <div class="card">
        <h3>New Enrollment</h3>
        <form id="regForm" onsubmit="saveMember(event)">
            <input type="text" id="mName" placeholder="Full Name" required>
            <input type="text" id="mAlias" placeholder="Alias (e.g. DennisG)" required>
            <input type="tel" id="mPhone" placeholder="MoMo Number" required>
            <select id="mType" required>
                <option value="" disabled selected>Membership Type</option>
                <option value="Full Member">Full Member</option>
                <option value="Student">Student</option>
            </select>
            <select id="mSub" required>
                <option value="" disabled selected>Subscription Plan</option>
                <option value="30">Monthly (GH₵ 200)</option>
                <option value="180">6 Months</option>
            </select>
            <button type="submit" id="btnJoin">Join & Subscribe</button>
        </form>
    </div>
</div>

<div id="payment" class="screen">
    <div class="card">
        <h3>Payment Gateway</h3>
        <div class="momo-box">
            <p>MTN Mobile Money</p>
            <b style="font-size: 1.4rem; color: var(--gold);">0597219410</b><br>
            <p>Name: <b>Ben Shadow</b></p>
            <small>Reference: <b id="refDisplay" style="color:var(--gold)">---</b></small>
        </div>
    </div>
</div>

<div id="admin" class="screen">
    <div id="adminLock">
        <div class="card">
            <h3>Admin Access</h3>
            <input type="password" id="adminPass" placeholder="Secret Code">
            <button onclick="unlockAdmin()">Enter Registry</button>
        </div>
    </div>
    <div id="adminPanel" style="display:none;">
        <div class="card">
            <h3>Live Registry</h3>
            <div id="fullMemberRegistry"><p>Loading...</p></div>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="nav('home', this)"><i class="fa fa-home"></i>Home</div>
    <div class="nav-item" onclick="nav('register', this)"><i class="fa fa-user-plus"></i>Join</div>
    <div class="nav-item" onclick="nav('payment', this)"><i class="fa fa-credit-card"></i>Pay</div>
    <div class="nav-item" onclick="nav('admin', this)"><i class="fa fa-users-cog"></i>Admin</div>
</nav>

<script>
    // --- FINAL CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyAg6tFbQ5T0WxogZ8Pq8fXEVJjMA3fmF0w",
        databaseURL: "https://shadow-gym-default-rtdb.firebaseio.com/",
        projectId: "shadow-gym"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    window.onload = checkSubStatus;

    function viewImg(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function nav(id, element) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        element.classList.add('active');
        if(id === 'payment') {
            const alias = localStorage.getItem('shadowAlias');
            document.getElementById('refDisplay').innerText = alias ? alias.toUpperCase() : "REGISTER FIRST";
        }
        if(id === 'home') checkSubStatus();
        if(id === 'admin') loadRegistry();
    }

    function saveMember(e) {
        e.preventDefault();
        const alias = document.getElementById('mAlias').value.trim().toLowerCase();
        const member = {
            name: document.getElementById('mName').value,
            alias: alias,
            phone: document.getElementById('mPhone').value,
            type: document.getElementById('mType').value,
            duration: parseInt(document.getElementById('mSub').value),
            status: "Pending",
            joined: new Date().toISOString()
        };

        database.ref('members/' + alias).set(member).then(() => {
            localStorage.setItem('shadowAlias', alias);
            alert("Registration Sent to Cloud!");
            nav('payment', document.querySelectorAll('.nav-item')[2]);
        }).catch(err => alert("Cloud Error: " + err.message));
    }

    function checkSubStatus() {
        const alias = localStorage.getItem('shadowAlias');
        const area = document.getElementById('userStatusArea');
        if(!alias) {
            area.innerHTML = "<button onclick=\"nav('register', document.querySelectorAll('.nav-item')[1])\">Register Now</button>";
            return;
        }
        database.ref('members/' + alias).on('value', (snapshot) => {
            const m = snapshot.val();
            if(m) {
                let st = m.status === "Active" ? `<span class="status-active">ACTIVE</span>` : `<span class="status-pending">PENDING</span>`;
                area.innerHTML = `<b>${m.name}</b><br>Status: ${st}`;
            }
        });
    }

    function unlockAdmin() {
        if(document.getElementById('adminPass').value === "SHADOWADMIN") {
            document.getElementById('adminLock').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadRegistry();
        } else { alert("Access Denied"); }
    }

    function loadRegistry() {
        const list = document.getElementById('fullMemberRegistry');
        database.ref('members').on('value', (snapshot) => {
            list.innerHTML = "";
            const members = snapshot.val();
            if(!members) { list.innerHTML = "No members registered."; return; }
            for (let id in members) {
                const m = members[id];
                list.innerHTML += `
                    <div class="member-list-item">
                        <div><b>${m.name}</b><br><small>${m.phone}</small></div>
                        <button onclick="activateUser('${id}', ${m.duration})" style="width:auto; padding:5px 10px;">${m.status === 'Active' ? 'RE-ACTIVATE' : 'ACTIVATE'}</button>
                    </div>`;
            }
        });
    }

    function activateUser(alias, days) {
        const exp = new Date();
        exp.setDate(exp.getDate() + days);
        database.ref('members/' + alias).update({ status: "Active", expiry: exp.toISOString() })
            .then(() => alert("Member Activated Successfully!"));
    }
</script>
</body>
</html>
