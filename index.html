<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
  };
  
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // UPGRADED SAVE FUNCTION (Syncs to Cloud)
  function saveMember(e) {
    e.preventDefault();
    const member = {
        name: document.getElementById('mName').value,
        alias: document.getElementById('mAlias').value,
        phone: document.getElementById('mPhone').value,
        location: document.getElementById('mLocation').value,
        type: document.getElementById('mType').value,
        duration: parseInt(document.getElementById('mSub').value),
        expiry: null,
        regDate: new Date().toISOString()
    };

    // Push to Firebase instead of LocalStorage
    database.ref('members').push(member)
        .then(() => {
            localStorage.setItem('lastAlias', member.alias);
            e.target.reset();
            alert("Success! Your data is now in the Shadow Cloud.");
            nav('payment');
        })
        .catch(err => alert("Error: " + err.message));
  }

  // UPGRADED SEARCH FUNCTION (Fetches from Cloud)
  function doSearch() {
    const query = document.getElementById('adminSearch').value.toLowerCase();
    const area = document.getElementById('adminResults');
    const now = new Date();

    // Listen for data changes in real-time
    database.ref('members').on('value', (snapshot) => {
        area.innerHTML = "";
        const data = snapshot.val();
        
        for (let id in data) {
            const m = data[id];
            if (m.name.toLowerCase().includes(query) || m.alias.toLowerCase().includes(query)) {
                let statusText = "INACTIVE";
                let statusClass = "status-expired";
                
                if(m.expiry) {
                    const expDate = new Date(m.expiry);
                    if(expDate > now) {
                        statusText = "ACTIVE - Ends: " + expDate.toLocaleDateString();
                        statusClass = "status-active";
                    }
                }

                area.innerHTML += `
                    <div style="background:#111; padding:15px; border-radius:12px; margin-bottom:12px; border:1px solid #333;">
                        <b style="color:var(--gold)">${m.name}</b> (${m.alias})<br>
                        <small>${m.type} | ${m.phone}</small><br>
                        <small style="color: #888;">Location: ${m.location}</small><br>
                        Status: <span class="${statusClass}">${statusText}</span><br>
                        <button onclick="activateSub('${id}', ${m.duration})" style="padding:10px; font-size:0.7rem;">Activate ${m.duration} Days</button>
                    </div>`;
            }
        }
    });
  }

  // UPGRADED ACTIVATION (Updates Cloud)
  function activateSub(firebaseId, duration) {
    const exp = new Date();
    exp.setDate(exp.getDate() + duration);
    
    database.ref('members/' + firebaseId).update({
        expiry: exp.toISOString()
    }).then(() => alert("Member Activated on all devices!"));
  }
</script>
